<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#fff7f0"/>
      <stop offset="1" stop-color="#ffe6d2"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ff6b00" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a2b"/>
      <stop offset="1" stop-color="#e04f00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#warm)"/>
  <circle cx="640" cy="500" r="520" fill="url(#halo)"/>
  <circle cx="640" cy="500" r="210" fill="url(#sun)" opacity="0.9"/>

  <g transform="translate(640 500)" stroke="#ff6b00" stroke-width="3" opacity="0.28">
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(0)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(30)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(60)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(90)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(120)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(150)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(180)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(210)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(240)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(270)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(300)"/>
    <line x1="0" y1="-250" x2="0" y2="-430" transform="rotate(330)"/>
  </g>

  <path d="M0 900 Q260 760 560 870 T1200 810 V1200 H0 Z" fill="#0a0a0a" opacity="0.08"/>
  <path d="M0 1030 Q320 890 640 990 T1200 940 V1200 H0 Z" fill="#0a0a0a" opacity="0.14"/>

  <g fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.07">
    <path d="M-100 200 Q300 120 700 260 T1300 200"/>
    <path d="M-100 260 Q300 180 700 320 T1300 260"/>
    <path d="M-100 320 Q300 240 700 380 T1300 320"/>
  </g>
</svg>
