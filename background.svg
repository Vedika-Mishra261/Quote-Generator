<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#181440"/>
      <stop offset="0.45" stop-color="#4b2c83"/>
      <stop offset="0.75" stop-color="#c9637c"/>
      <stop offset="1" stop-color="#f6b26b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#sky)"/>

  <g fill="#ffffff" opacity="0.55">
    <circle cx="160" cy="140" r="2"/>
    <circle cx="320" cy="90" r="1.5"/>
    <circle cx="470" cy="190" r="2"/>
    <circle cx="980" cy="120" r="1.8"/>
    <circle cx="1080" cy="260" r="2"/>
    <circle cx="860" cy="70" r="1.4"/>
    <circle cx="90" cy="330" r="1.5"/>
    <circle cx="1130" cy="430" r="1.5"/>
  </g>

  <circle cx="620" cy="510" r="360" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="620" cy="510" r="120" fill="#ffe7ad" opacity="0.95"/>

  <g transform="translate(620 510)" stroke="#ffe7ad" stroke-width="3" opacity="0.22">
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(0)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(30)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(60)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(90)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(120)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(150)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(180)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(210)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(240)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(270)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(300)"/>
    <line x1="0" y1="-160" x2="0" y2="-340" transform="rotate(330)"/>
  </g>

  <path d="M0 880 Q260 720 560 850 T1200 790 V1200 H0 Z" fill="#2a2059" opacity="0.85"/>
  <path d="M0 1010 Q320 860 640 970 T1200 920 V1200 H0 Z" fill="#171137" opacity="0.95"/>

  <g fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08">
    <path d="M-100 200 Q300 120 700 260 T1300 200"/>
    <path d="M-100 260 Q300 180 700 320 T1300 260"/>
    <path d="M-100 320 Q300 240 700 380 T1300 320"/>
  </g>
</svg>
